# KShake: shaking leaves the field's text where it was and the button usable.
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: animation.shake
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Shake" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "1234" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Shake" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Shake" }
- runFlow: ../../../_lib/assert-no-crash.yaml
