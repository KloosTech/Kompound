# KPasswordField renders in whatever environment the caller opens it in (assertions only).
# env: THEME, FONT, RTL, DENSITY, LANG (all optional, see _lib/open-demo.yaml)
appId: tech.kloos.kompound.catalog.maestro
---
- runScript:
    file: ../../../_lib/strings.js
    env:
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: textfield.password
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Password" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "At least 8 characters" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "${output.s.showPassword}" }
- runFlow: ../../../_lib/assert-no-crash.yaml
