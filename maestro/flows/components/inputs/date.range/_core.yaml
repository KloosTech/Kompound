# KDateRangeField shows label and placeholder, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: date.range
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Stay" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Pick dates" }
- runFlow: ../../../_lib/assert-no-crash.yaml
