appId: tech.kloos.kompound.catalog.maestro
name: slider.basic states
tags:
  - states
  - component:slider.basic
  - category:inputs
properties:
  junitClassname: slider.basic
---
# disabled: a tap on the track changes nothing
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: slider.basic
      CONTROLS: "control=Enabled::false"
- tapOn:
    point: "85%,20%"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Value: 40" }
# steps: the value snaps to a multiple of 20
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: slider.basic
      CONTROLS: "control=Steps%20(0%20=%20continuous)::4"
- tapOn:
    point: "55%,20%"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Value: (0|20|40|60|80|100)" }
- runFlow: ../../../_lib/assert-no-crash.yaml
