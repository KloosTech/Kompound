# KChip: a filter chip toggles with each tap, independent of the other; an action chip does not change state.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: chip.basic
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Not selected" }
- runFlow:
    file: ../../../_lib/assert-checked.yaml
    env: { LABEL: "Not selected" }
- runFlow:
    file: ../../../_lib/assert-checked.yaml
    env: { LABEL: "Selected" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Selected" }
- runFlow:
    file: ../../../_lib/assert-unchecked.yaml
    env: { LABEL: "Selected" }
- runFlow:
    file: ../../../_lib/assert-checked.yaml
    env: { LABEL: "Not selected" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Selected" }
- runFlow:
    file: ../../../_lib/assert-checked.yaml
    env: { LABEL: "Selected" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Chip" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Chip" }
- runFlow: ../../../_lib/assert-no-crash.yaml
