# KCombobox: typing filters the options, choosing one reports it.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: combobox.basic
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Type to search" }
- inputText: "Ger"
- assertVisible: "Germany"
- assertNotVisible: "Austria"
- tapOn:
    text: "Germany"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Chosen: Germany .Europe." }
- hideKeyboard
- runFlow: ../../../_lib/assert-no-crash.yaml
