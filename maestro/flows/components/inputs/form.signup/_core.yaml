# The sign-up form shows its group, fields, hints and buttons, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
# This page is longer than the screen: the controls card is out of view, so selectors are not scoped above it.
appId: tech.kloos.kompound.catalog.maestro
---
- runScript:
    file: ../../../_lib/strings.js
    env: { LANG: "${LANG}" }
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: form.signup
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- assertVisible: "Account"
- assertVisible: "Name"
- assertVisible: "E-mail"
- assertVisible: "Age .optional."
- assertVisible: "13 to 120"
- assertVisible: "I accept the terms"
- assertVisible: "${output.s.submit}"
- runFlow: ../../../_lib/assert-no-crash.yaml
