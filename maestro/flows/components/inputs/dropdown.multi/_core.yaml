# KMultiDropdown summarises the choices in its field and lists the options with the chosen ones checked, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: dropdown.multi
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Fruits" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Apple, Cherry" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Apple, Cherry" }
- assertVisible: "Apple"
- assertVisible: "Banana"
- assertVisible: "Cherry"
- assertVisible: "Dragon fruit"
- assertVisible: "Elderberry"
- assertVisible: "Fig"
- assertVisible:
    checked: true
    containsChild: "Apple"
- assertVisible:
    checked: true
    containsChild: "Cherry"
- assertNotVisible:
    checked: true
    containsChild: "Banana"
- back
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Apple, Cherry" }
- runFlow: ../../../_lib/assert-no-crash.yaml
