appId: tech.kloos.kompound.catalog.maestro
name: color.picker states
tags:
  - states
  - component:color.picker
  - category:inputs
properties:
  junitClassname: color.picker
---
# opacity: the hex value gets an alpha part
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: color.picker
      CONTROLS: "control=Opacity::true"
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: #[0-9A-Fa-f]{8}" }
# no swatches
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: color.picker
      CONTROLS: "control=Swatches::false"
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: #6750A4" }
- runFlow:
    file: ../../../_lib/preview-not-see.yaml
    env: { TEXT: "#E53935" }
# no hex field
- runScript:
    file: ../../../_lib/strings.js
    env: { LANG: en }
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: color.picker
      CONTROLS: "control=Hex%20field::false"
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: #6750A4" }
- runFlow:
    file: ../../../_lib/preview-not-see.yaml
    env: { TEXT: "Hex color" }
# disabled: a swatch changes nothing
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: color.picker
      CONTROLS: "control=Enabled::false"
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "#E53935" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: #6750A4" }
- runFlow: ../../../_lib/assert-no-crash.yaml
