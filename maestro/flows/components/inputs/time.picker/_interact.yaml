# KTimePicker: steppers change hours and minutes (with wrap), the field opens a dialog whose OK fills it.
appId: tech.kloos.kompound.catalog.maestro
---
- runScript:
    file: ../../../_lib/strings.js
    env: { LANG: "${LANG}" }
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: time.picker
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "${output.s.hour} \\+" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: 10:30" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "${output.s.minute} \\+" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: 10:31" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "${output.s.hour} -" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "${output.s.hour} -" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: 08:31" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "${output.s.minute} -" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Picked: 08:30" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Choose a time" }
- assertVisible: "${output.s.cancel}"
- assertVisible: "${output.s.ok}"
- tapOn:
    text: "${output.s.cancel}"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Choose a time" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Choose a time" }
- tapOn:
    text: "${output.s.ok}"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "12:00" }
- runFlow:
    file: ../../../_lib/preview-not-see.yaml
    env: { TEXT: "Choose a time" }
- runFlow: ../../../_lib/assert-no-crash.yaml
