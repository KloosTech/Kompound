appId: tech.kloos.kompound.catalog.maestro
name: template.fields environments
tags:
  - env
  - slow
  - component:template.fields
  - category:inputs
properties:
  junitClassname: template.fields
---
- runFlow:
    file: _core.yaml
    env: { THEME: dark }
- runFlow:
    file: _core.yaml
    env: { RTL: "true" }
- runFlow:
    file: _core.yaml
    env: { FONT: "2.0" }
- runFlow:
    file: _core.yaml
    env: { DENSITY: compact }
- runFlow:
    file: _core.yaml
    env: { LANG: de }
# the editors are edited by tapping text whose position moves with direction and size: the interaction runs in the default environment only (10-interact)
- runFlow:
    file: _core.yaml
    env: { THEME: dark, RTL: "true", FONT: "1.5", DENSITY: compact, LANG: de }
