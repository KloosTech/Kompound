# KSwitch: taps change the checked state, as seen through the accessibility tree.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: switch.basic
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Bluetooth" }
- runFlow:
    file: ../../../_lib/assert-checked.yaml
    env: { LABEL: "Bluetooth" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Wi-Fi" }
- runFlow:
    file: ../../../_lib/assert-unchecked.yaml
    env: { LABEL: "Wi-Fi" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Wi-Fi" }
- runFlow:
    file: ../../../_lib/assert-checked.yaml
    env: { LABEL: "Wi-Fi" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Bluetooth" }
- runFlow:
    file: ../../../_lib/assert-unchecked.yaml
    env: { LABEL: "Bluetooth" }
- runFlow: ../../../_lib/assert-no-crash.yaml
