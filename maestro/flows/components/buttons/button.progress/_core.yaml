# KProgressButton shows the percentage while running (the label is replaced), in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: button.progress
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "40%" }
- runFlow:
    file: ../../../_lib/assert-disabled.yaml
    env: { LABEL: "40%" }
- runFlow: ../../../_lib/assert-no-crash.yaml
