# KToggleButton starts off and enabled, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: button.toggle
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Off" }
- runFlow:
    file: ../../../_lib/assert-unchecked.yaml
    env: { LABEL: "Off" }
- runFlow:
    file: ../../../_lib/assert-enabled.yaml
    env: { LABEL: "Off" }
- runFlow: ../../../_lib/assert-no-crash.yaml
