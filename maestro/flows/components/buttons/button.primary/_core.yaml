# KButton renders in whatever environment the caller opens it in (assertions only: no taps, so the environment matrix stays fast).
# env: THEME, FONT, RTL, DENSITY, LANG (all optional, see _lib/open-demo.yaml)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: button.primary
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Button" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Filled" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Tonal" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Outlined" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Text" }
- runFlow:
    file: ../../../_lib/assert-enabled.yaml
    env: { LABEL: Filled }
- runFlow: ../../../_lib/assert-no-crash.yaml
