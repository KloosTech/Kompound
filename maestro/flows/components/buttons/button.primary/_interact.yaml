# What a user does with KButton, in whatever environment the caller opens it in. Every tap costs about two seconds, so keep it short.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: button.primary
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Filled" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Text" }
- runFlow: ../../../_lib/assert-no-crash.yaml
- runFlow:
    file: ../../../_lib/assert-enabled.yaml
    env: { LABEL: Filled }
