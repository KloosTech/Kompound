# KIconButton: taps are accepted and the buttons stay in place (the demo has no visible result).
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: button.icon
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Favourite" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Confirm" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Favourite" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Confirm" }
- runFlow: ../../../_lib/assert-no-crash.yaml
