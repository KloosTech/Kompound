# KErrorState shows title, description and retry, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runScript:
    file: ../../../_lib/strings.js
    env: { LANG: "${LANG}" }
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: state.error
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Could not load messages" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Check your connection.*" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "${output.s.tryAgain}" }
- runFlow: ../../../_lib/assert-no-crash.yaml
