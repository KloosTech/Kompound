# KSkeleton shows placeholders and no text while loading, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: skeleton.loading
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-not-see.yaml
    env: { TEXT: "Ada Lovelace" }
- runFlow: ../../../_lib/assert-no-crash.yaml
