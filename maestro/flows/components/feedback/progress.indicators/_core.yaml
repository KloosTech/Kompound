# The linear and circular indicators sit under their headings, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: progress.indicators
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Linear" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Circular" }
- runFlow: ../../../_lib/assert-no-crash.yaml
