# KEmptyState shows title, description and action, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: state.empty
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "No messages yet" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "When someone writes to you.*" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Write a message" }
- runFlow: ../../../_lib/assert-no-crash.yaml
