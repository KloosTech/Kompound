# The engine demo shows its toolbar, tabs and hint, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
# This page is longer than the screen: the controls card is out of view, so selectors are not scoped above it.
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: graph.engine
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- assertVisible: "Run"
- assertVisible: "Run again"
- assertVisible: "Undo"
- assertVisible: "Redo"
- assertVisible: "Fit"
- assertVisible: "Editor"
- assertVisible: "Executions"
- assertVisible: "Change a number or a delay.*"
- runFlow: ../../../_lib/assert-no-crash.yaml
