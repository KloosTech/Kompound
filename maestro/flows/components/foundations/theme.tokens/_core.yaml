# The semantic colours and the spacing scale are listed, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: theme.tokens
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Success" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Success container" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Warning" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Info" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Spacing scale" }
- runFlow: ../../../_lib/assert-no-crash.yaml
