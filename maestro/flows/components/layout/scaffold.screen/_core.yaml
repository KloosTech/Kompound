# KScaffold shows top bar, content, bottom bar and button, in the caller's environment.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: scaffold.screen
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Inbox" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Message 1" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Preview of the message text" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Bottom bar slot" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Back" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Favourite" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Done" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Create" }
- runFlow: ../../../_lib/assert-no-crash.yaml
