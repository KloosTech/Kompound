# KScaffold: the top bar and floating buttons accept taps and the screen stays.
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: scaffold.screen
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Favourite" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Create" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Back" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Inbox" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Message 1" }
- runFlow: ../../../_lib/assert-no-crash.yaml
