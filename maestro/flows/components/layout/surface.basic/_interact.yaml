# KSurface (clickable): a tap is accepted and the content stays.
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: surface.basic
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Text and icon share the content colour" }
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Text and icon share the content colour" }
- runFlow: ../../../_lib/assert-no-crash.yaml
