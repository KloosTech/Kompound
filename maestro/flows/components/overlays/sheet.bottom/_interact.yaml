# KBottomSheet: a list item, back, the close button and a tap on the scrim dismiss it.
# env: THEME, FONT, RTL, DENSITY, LANG (all optional)
appId: tech.kloos.kompound.catalog.maestro
---
- runScript:
    file: ../../../_lib/strings.js
    env: { LANG: "${LANG}" }
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: sheet.bottom
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Open" }
- tapOn:
    text: "Grace Hopper"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Open" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Open" }
- assertVisible: "Share with"
- back
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Open" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Open" }
- tapOn:
    text: "${output.s.close}"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Open" }
- runFlow:
    file: ../../../_lib/preview-tap.yaml
    env: { TEXT: "Open" }
- assertVisible: "Share with"
- tapOn:
    point: "50%,6%"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Open" }
- runFlow: ../../../_lib/assert-no-crash.yaml
