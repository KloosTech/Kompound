# KLineChart: a tap on the chart keeps the page intact (the tooltip is drawn, not announced).
appId: tech.kloos.kompound.catalog.maestro
---
- runFlow:
    file: ../../../_lib/open-demo.yaml
    env:
      DEMO: chart.simple
      THEME: ${THEME}
      FONT: ${FONT}
      RTL: ${RTL}
      DENSITY: ${DENSITY}
      LANG: ${LANG}
- tapOn:
    point: "50%,30%"
    retryTapIfNoChange: false
- runFlow:
    file: ../../../_lib/preview-see.yaml
    env: { TEXT: "Visits" }
- runFlow: ../../../_lib/assert-no-crash.yaml
