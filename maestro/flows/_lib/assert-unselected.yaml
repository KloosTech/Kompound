# The tab / item whose label is LABEL is shown and not selected (negative form, see assert-unchecked).
# env: LABEL
appId: tech.kloos.kompound.catalog.maestro
---
- assertVisible:
    text: "${LABEL}"
    above:
      id: "harness:controls"
- assertNotVisible:
    selected: true
    containsChild: "${LABEL}"
    above:
      id: "harness:controls"
