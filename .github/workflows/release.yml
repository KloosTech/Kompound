name: Release

# Trigger: push a tag like v0.1.0 (or v0.1.0-alpha01).
# Every publishing step skips (does not fail) when its secrets are missing, so the workflow is safe
# to run before secrets are configured. See docs/RELEASING.md for the secret names.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without leading v)
        required: true
      auto_release:
        description: Release to Maven Central automatically (otherwise upload only, release manually in the portal)
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  library:
    name: Publish library to Maven Central
    runs-on: macos-latest   # Apple targets can only be built on macOS
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Check secrets
        id: secrets
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          K: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: |
          if [ -n "$U" ] && [ -n "$K" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::Maven Central secrets missing, publishing skipped"; fi
      - name: Publish
        if: steps.secrets.outputs.present == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          V="${VERSION#v}"
          TASK=publishToMavenCentralAll
          if [ "${{ inputs.auto_release }}" = "true" ]; then TASK=publishAndReleaseToMavenCentralAll; fi
          ./gradlew "$TASK" -PVERSION_NAME="$V" --stacktrace

  android:
    name: Catalog APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Prepare keystore (if secret exists)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No Android keystore secret, APK will be debug-signed (-unsigned suffix)"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :catalog:androidApp:assembleRelease -PVERSION_NAME="${VERSION#v}" --stacktrace
      - name: Name artifact
        run: |
          mkdir -p out
          SUFFIX=""; [ "$SIGNED" = "true" ] || SUFFIX="-unsigned"
          cp catalog/androidApp/build/outputs/apk/release/*.apk "out/kompound-catalog-${VERSION#v}${SUFFIX}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: catalog-android, path: out/* }

  desktop:
    name: Catalog desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Package (unsigned, unnotarised)
        shell: bash
        run: ./gradlew :catalog:desktopApp:packageDistributionForCurrentOS -PVERSION_NAME="${VERSION#v}" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-desktop-${{ matrix.os }}
          path: |
            catalog/desktopApp/build/compose/binaries/main/dmg/*.dmg
            catalog/desktopApp/build/compose/binaries/main/msi/*.msi
            catalog/desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  github-release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: List
        run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: artifacts/**/*
