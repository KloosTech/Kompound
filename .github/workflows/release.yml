name: Release (library)

# Publishes the LIBRARY to Maven Central. Trigger: push a tag like v0.2.0 (or v0.2.0-alpha01).
# The catalog apps are released separately by catalog-release.yml (tags catalog-v*), so the library can
# ship often while the catalog only ships on milestones.
# Publishing skips (does not fail) when its secrets are missing. See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without leading v)
        required: true
      auto_release:
        description: Release to Maven Central automatically (otherwise upload only, release manually in the portal)
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # tag for pushes, v<input> for manual runs
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  library:
    name: Publish library to Maven Central
    runs-on: macos-latest   # Apple targets can only be built on macOS
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Check secrets
        id: secrets
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          K: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: |
          if [ -n "$U" ] && [ -n "$K" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::Maven Central secrets missing, publishing skipped"; fi
      - name: Publish
        if: steps.secrets.outputs.present == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          V="${VERSION#v}"
          TASK=publishToMavenCentralAll
          if [ "${{ inputs.auto_release }}" = "true" ]; then TASK=publishAndReleaseToMavenCentralAll; fi
          ./gradlew "$TASK" -PVERSION_NAME="$V" --stacktrace

  github-release:
    name: GitHub Release (notes only)
    needs: library
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kompound ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
