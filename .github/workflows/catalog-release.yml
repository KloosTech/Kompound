name: Release (catalog)

# Builds the CATALOG apps (Android APK, desktop installers) and attaches them to a GitHub Release.
# Triggers: a push to main builds the Android APK and publishes it as catalog-v<VERSION_NAME>-build.<run> so Obtainium
# sees every merge; pushing a tag like catalog-v1.0.0 (or running the workflow by hand) also builds the desktop
# installers. Independent of library releases (v* tags).
# The web catalog needs no release: catalog-web.yml deploys it to GitHub Pages on every push to main.
# Only the newest catalog release is kept: after publishing, older catalog-v* releases and their tags are deleted.
# The APK must be signed with the same key every time (ANDROID_* secrets) or Android/Obtainium cannot update it.
# See docs/RELEASING.md.

on:
  push:
    branches: [main]
    tags: ['catalog-v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/release.yml'
      - '.github/workflows/catalog-web.yml'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      version:
        description: Catalog version (without the catalog-v prefix)
        required: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  meta:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="catalog-v$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          else
            BASE=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | sed 's/-.*//')
            TAG="catalog-v${BASE}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  android:
    name: Catalog APK
    needs: meta
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Prepare keystore (if secret exists)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is debug-signed and CANNOT be updated in place (run scripts/create-android-keystore.sh)"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :catalog:androidApp:assembleRelease -PVERSION_NAME="${VERSION#catalog-v}" -PVERSION_CODE="${{ github.run_number }}" --stacktrace
      - name: Name artifact
        run: |
          mkdir -p out
          SUFFIX=""; [ "$SIGNED" = "true" ] || SUFFIX="-unsigned"
          cp catalog/androidApp/build/outputs/apk/release/*.apk "out/kompound-catalog-${VERSION#catalog-v}${SUFFIX}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: catalog-android, path: out/* }

  desktop:
    name: Catalog desktop (${{ matrix.os }})
    needs: meta
    # Installers only for tagged or manual releases; merges to main publish just the APK.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Package (unsigned, unnotarised)
        shell: bash
        run: ./gradlew :catalog:desktopApp:packageDistributionForCurrentOS -PVERSION_NAME="${VERSION#catalog-v}" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-desktop-${{ matrix.os }}
          path: |
            catalog/desktopApp/build/compose/binaries/main/dmg/*.dmg
            catalog/desktopApp/build/compose/binaries/main/msi/*.msi
            catalog/desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  github-release:
    needs: [meta, android, desktop]
    if: ${{ !cancelled() && needs.android.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: List
        run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Kompound Catalog ${{ env.TAG }}
          generate_release_notes: true
          # Always a regular release: only one is kept, and Obtainium skips pre-releases by default.
          prerelease: false
          make_latest: false
          files: artifacts/**/*
      - name: Keep only the newest catalog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^catalog-v' | grep -vxF "$TAG" \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
